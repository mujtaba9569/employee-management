
spring.application.name=backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employee_db}
spring.datasource.username=${DB_USERNAME:mujtabasyed}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Basic Authentication
spring.security.user.name=admin
spring.security.user.password=${APP_PASSWORD:admin}
spring.security.user.roles=ADMIN

# Department caching
spring.cache.type=simple
spring.cache.cache-names=departments